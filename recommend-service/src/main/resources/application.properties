server.port=8084
spring.application.name=recommend-service

# ============================================================
#  DeepSeek 大模型配置（AI 智能导购）
#
#  ⭐ 本仓库已公开，真实 Key 已移除。在下面填入你的 DeepSeek API Key：
#     例如 deepseek.api-key=sk-xxxxxxxxxxxxxxxx
#     也可以留空并用环境变量 DEEPSEEK_API_KEY 覆盖（二选一），
#     未配置 Key 时自动回退到「规则推荐」，功能仍可用（仅非 AI）。
#
#  模型说明：deepseek-v4-flash（便宜快、原生 JSON 输出，适合推荐场景）。
#  如需更强推理可改为 deepseek-v4-pro，但速度更慢、费用约 3 倍。
# ============================================================
deepseek.api-key=
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-v4-flash
deepseek.max-tokens=2000
deepseek.top-n=4
deepseek.temperature=0.3
deepseek.timeout=12s
deepseek.connect-timeout=3s

# 统一 UTF-8，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
