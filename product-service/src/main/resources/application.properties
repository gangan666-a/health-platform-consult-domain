server.port=8081
spring.application.name=product-service

# ---------- 数据库：外部 MySQL（本机 3306，数据库 shopdb_product，用户 shop） ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopdb_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=shop
spring.datasource.password=shop123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 统一 UTF-8，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
