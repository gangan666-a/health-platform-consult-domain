<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${productName} + ' - 在线问诊')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container narrow">
    <div id="consult-app"
         th:attr="data-session-id=${sessionId}, data-role=${role}, data-token=${token},
                   data-ws-url=${wsUrl}, data-product-name=${productName}, data-product-id=${productId},
                   data-status-label=${statusLabel}">
        <div class="consult-head">
            <div>
                <div class="consult-title">💬 在线问诊 · <span th:text="${productName}">商品</span></div>
                <div class="muted small">状态：<span id="consult-status" th:text="${statusLabel}">等待医生接入</span></div>
            </div>
            <button class="btn btn-danger-ghost btn-sm" type="button" id="end-btn">结束问诊</button>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="chat-tip">医生接入后将在此聊天，可实时文字沟通。</div>
        </div>

        <div class="chat-input-row" id="chat-input-row">
            <input id="msg-input" type="text" placeholder="请输入消息（最长 500 字）..." maxlength="500" autocomplete="off">
            <button class="btn btn-primary" id="send-btn" type="button">发送</button>
        </div>

        <!-- 医生开方面板：仅医生视角可见 -->
        <div class="prescribe-panel" id="prescribe-panel" th:if="${role == 'doctor'}">
            <div class="panel-title">🔖 开具处方</div>
            <div class="form-group">
                <label for="dosage">用法</label>
                <input id="dosage" type="text" placeholder="如：每次 1 粒">
            </div>
            <div class="form-group">
                <label for="frequency">频率</label>
                <input id="frequency" type="text" placeholder="如：每日 3 次">
            </div>
            <div class="form-group">
                <label for="rx-quantity">数量</label>
                <input id="rx-quantity" type="number" min="1" max="999" value="1">
            </div>
            <button class="btn btn-primary" id="prescribe-btn" type="button">开具处方</button>
            <p class="muted small">开具后会话将结束，处方有效期 7 天，用户凭处方单号在确认订单页下单。</p>
        </div>

        <!-- 处方已开具：展示处方单号 + 去下单（仅用户视角） -->
        <div class="prescription-card hidden" id="prescription-card">
            <div class="state-icon ok">✅</div>
            <div>医生已开具处方，处方单号：<strong id="prescription-no"></strong></div>
            <a class="btn btn-primary" id="go-order-btn" href="#">去下单</a>
        </div>

        <div class="token-warning hidden" id="token-warning">连接已失效，请<a href="javascript:location.reload()">刷新页面</a>重连。</div>
    </div>
</main>
<script th:src="@{/js/consult.js}"></script>
</body>
</html>
