<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('确认订单')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container narrow">
    <h1 class="page-title">确认订单</h1>
    <div class="panel">
        <div class="confirm-item">
            <span class="thumb-emoji" th:text="${product.imageUrl ?: '📦'}">📦</span>
            <div class="grow">
                <div class="card-name">
                    <span th:text="${product.name}">商品名称</span>
                    <span class="rx-badge" th:if="${product.rxFlag}">处方药</span>
                </div>
                <div class="muted"
                     th:text="'单价 ¥' + ${#numbers.formatDecimal(product.price, 1, 2)} + ' × ' + ${quantity}">单价 × 数量</div>
            </div>
            <div class="price" th:text="'¥' + ${#numbers.formatDecimal(total, 1, 2)}">¥0.00</div>
        </div>

        <form class="form" th:action="@{/order}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{productId}">

            <div class="form-group">
                <label for="quantity">购买数量</label>
                <input id="quantity" type="number" min="1" max="999" th:field="*{quantity}" placeholder="请输入购买数量（1-999）">
                <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
            </div>

            <div class="form-group">
                <label for="receiverName">收货人</label>
                <input id="receiverName" type="text" th:field="*{receiverName}" placeholder="请输入收货人姓名">
                <span class="field-error" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></span>
            </div>
            <div class="form-group">
                <label for="receiverPhone">手机号</label>
                <input id="receiverPhone" type="text" th:field="*{receiverPhone}" placeholder="请输入 11 位手机号">
                <span class="field-error" th:if="${#fields.hasErrors('receiverPhone')}" th:errors="*{receiverPhone}"></span>
            </div>
            <div class="form-group">
                <label for="receiverAddress">收货地址</label>
                <textarea id="receiverAddress" th:field="*{receiverAddress}" rows="3" placeholder="请输入详细收货地址"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('receiverAddress')}" th:errors="*{receiverAddress}"></span>
            </div>

            <!-- 处方药：必须填写处方单号（fail-closed，PRD FR-D1）；非处方药隐藏 -->
            <div class="form-group rx-prescription-group" th:if="${product.rxFlag}">
                <div class="rx-hint">
                    <span>🔖 处方药需凭医生开具的处方单号购买</span>
                    <a class="link small" th:href="@{'/product/' + ${product.id}}">← 前往在线问诊</a>
                </div>
                <label for="prescriptionNo">处方单号</label>
                <input id="prescriptionNo" type="text" th:field="*{prescriptionNo}" placeholder="如 RX202608071010100001"
                       maxlength="32">
                <span class="field-error" th:if="${#fields.hasErrors('prescriptionNo')}" th:errors="*{prescriptionNo}"></span>
            </div>

            <div class="confirm-footer">
                <div>合计：<span class="price large" th:text="'¥' + ${#numbers.formatDecimal(total, 1, 2)}">¥0.00</span></div>
                <button class="btn btn-primary btn-lg" type="submit">提交订单</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
