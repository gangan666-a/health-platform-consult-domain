<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('支付成功')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div class="container narrow center">
        <div class="state-box">
            <div class="state-icon ok">✔</div>
            <h1>支付成功</h1>
            <p>
                订单 <strong th:text="${order.orderNo}">SO...</strong>
                已支付 <span class="price" th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">¥0.00</span>
                <span th:if="${order.payMethod}" th:text="'（' + ${order.payMethod} + '）'">（支付方式）</span>
            </p>
            <p th:if="${order.payBank}" class="muted"
               th:text="'通过 ' + ${order.payBank} + '（尾号 ' + ${order.payCardTail} + '）完成扣款'">支付账户</p>
            <div class="actions center">
                <a class="btn btn-primary" th:href="@{'/order/' + ${order.orderNo}}">查看订单</a>
                <a class="btn btn-outline" th:href="@{/}">继续购物</a>
            </div>
        </div>
    </div>

    <!-- 同类商品推荐：与已购商品同品类，推荐为空（服务未就绪）时整个区块不渲染 -->
    <section class="container recommend-section" th:if="${!#lists.isEmpty(similarRecommendations)}">
        <div class="recommend-head">
            <h2 class="page-title">🔄 同类商品推荐</h2>
            <span class="recommend-tag">与您购买的商品同品类</span>
        </div>
        <div class="product-grid">
            <div class="product-card" th:each="rec : ${similarRecommendations}">
                <a class="card-thumb" th:href="@{'/product/' + ${rec.productId}}">
                    <span class="thumb-emoji"
                          th:if="${rec.imageUrl != null && !rec.imageUrl.startsWith('http')}"
                          th:text="${rec.imageUrl}">📦</span>
                    <img th:if="${rec.imageUrl != null && rec.imageUrl.startsWith('http')}"
                         th:src="${rec.imageUrl}" alt="推荐商品">
                </a>
                <div class="card-body">
                    <a class="card-name" th:href="@{'/product/' + ${rec.productId}}" th:text="${rec.productName}">商品名称</a>
                    <p class="card-desc" th:text="${rec.reason}">推荐理由</p>
                    <div class="card-meta">
                        <span class="price" th:text="'¥' + ${#numbers.formatDecimal(rec.price, 1, 2)}">¥0.00</span>
                        <span class="recommend-badge"
                              th:text="${rec.source == 'ai' ? '🤖 AI 推荐' : '同类优选'}">推荐</span>
                    </div>
                    <div class="card-actions">
                        <a class="btn btn-primary" th:href="@{/order/confirm(productId=${rec.productId}, quantity=1)}">立即购买</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- AI 智能导购：推荐为空（服务未就绪）时整个区块不渲染 -->
    <section class="container recommend-section" th:if="${!#lists.isEmpty(recommendations)}">
        <div class="recommend-head">
            <h2 class="page-title">✨ AI 智能导购 · 你可能还需要</h2>
            <span class="recommend-tag">基于已购商品智能推荐</span>
        </div>
        <div class="product-grid">
            <div class="product-card" th:each="rec : ${recommendations}">
                <a class="card-thumb" th:href="@{'/product/' + ${rec.productId}}">
                    <span class="thumb-emoji"
                          th:if="${rec.imageUrl != null && !rec.imageUrl.startsWith('http')}"
                          th:text="${rec.imageUrl}">📦</span>
                    <img th:if="${rec.imageUrl != null && rec.imageUrl.startsWith('http')}"
                         th:src="${rec.imageUrl}" alt="推荐商品">
                </a>
                <div class="card-body">
                    <a class="card-name" th:href="@{'/product/' + ${rec.productId}}" th:text="${rec.productName}">商品名称</a>
                    <p class="card-desc" th:text="${rec.reason}">推荐理由</p>
                    <div class="card-meta">
                        <span class="price" th:text="'¥' + ${#numbers.formatDecimal(rec.price, 1, 2)}">¥0.00</span>
                        <span class="recommend-badge"
                              th:text="${rec.source == 'ai' ? '🤖 AI 推荐' : '✨ 搭配推荐'}">推荐</span>
                    </div>
                    <div class="card-actions">
                        <a class="btn btn-primary" th:href="@{/order/confirm(productId=${rec.productId}, quantity=1)}">立即购买</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
