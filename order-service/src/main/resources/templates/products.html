<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('商品列表')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <h1 class="page-title">商品浏览</h1>
    <div class="product-grid">
        <div class="product-card" th:each="product : ${products}">
            <a class="card-thumb" th:href="@{'/product/' + ${product.id}}">
                <span class="thumb-emoji"
                      th:if="${product.imageUrl != null && !product.imageUrl.startsWith('http')}"
                      th:text="${product.imageUrl}">📦</span>
                <img th:if="${product.imageUrl != null && product.imageUrl.startsWith('http')}"
                     th:src="${product.imageUrl}" alt="商品图片">
            </a>
            <div class="card-body">
                <a class="card-name" th:href="@{'/product/' + ${product.id}}" th:text="${product.name}">商品名称</a>
                <p class="card-desc" th:text="${product.description}">商品描述</p>
                <div class="card-meta">
                    <span class="price" th:text="'¥' + ${#numbers.formatDecimal(product.price, 1, 2)}">¥0.00</span>
                    <span class="stock" th:text="'库存 ' + ${product.stock}">库存 0</span>
                </div>
                <div class="card-actions">
                    <a class="btn btn-primary" th:href="@{/order/confirm(productId=${product.id}, quantity=1)}">立即购买</a>
                    <a class="btn btn-outline" th:href="@{'/product/' + ${product.id}}">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
