<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name} + ' - 商品详情')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container narrow">
    <div class="detail-layout">
        <div class="detail-thumb">
            <span class="thumb-emoji large"
                  th:if="${product.imageUrl != null && !product.imageUrl.startsWith('http')}"
                  th:text="${product.imageUrl}">📦</span>
            <img th:if="${product.imageUrl != null && product.imageUrl.startsWith('http')}"
                 th:src="${product.imageUrl}" alt="商品图片">
        </div>
        <div class="detail-info">
            <h1 class="detail-name" th:text="${product.name}">商品名称</h1>
            <p class="detail-desc" th:text="${product.description}">商品描述</p>
            <div class="detail-price">
                <span class="price large" th:text="'¥' + ${#numbers.formatDecimal(product.price, 1, 2)}">¥0.00</span>
                <span class="stock" th:text="'库存 ' + ${product.stock} + ' 件'">库存 0 件</span>
            </div>
            <form class="buy-form" th:action="@{/order/confirm(productId=${product.id}, quantity=1)}" method="get">
                <label for="qty">购买数量</label>
                <input id="qty" type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                <button class="btn btn-primary btn-lg" type="submit">立即购买</button>
            </form>
            <a class="link" th:href="@{/}">← 返回商品列表</a>
        </div>
    </div>
</main>
</body>
</html>
