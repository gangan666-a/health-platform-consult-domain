server.port=8082
spring.application.name=order-service

# ---------- 内部服务地址（改端口时需同步修改） ----------
mall.product-service.url=http://localhost:8081
mall.payment-service.url=http://localhost:8083
mall.recommend-service.url=http://localhost:8084

# ---------- 数据库：外部 MySQL（本机 3306，数据库 shopdb_order，用户 shop） ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopdb_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=shop
spring.datasource.password=shop123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 开发阶段关闭模板缓存，便于改页面即时生效
spring.thymeleaf.cache=false

# 统一 UTF-8，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
