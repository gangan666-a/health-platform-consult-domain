# ---------- 测试环境：H2 内存库（MySQL 兼容模式），避免依赖外部 MySQL ----------
spring.datasource.url=jdbc:h2:mem:ordert;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ---------- 内部服务地址：测试中通过 @MockBean 替换，无需真实网络，保留占位即可 ----------
mall.product-service.url=http://localhost:65531
mall.payment-service.url=http://localhost:65532
mall.recommend-service.url=http://localhost:65533
mall.consult-service.url=http://localhost:65534
mall.consult-service.ws-url=ws://localhost:65535/ws

# 统一 UTF-8，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
