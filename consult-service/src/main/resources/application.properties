server.port=8085
spring.application.name=consult-service

# ---------- 数据库：外部 MySQL（本机 3306，数据库 shopdb_consult，用户 shop） ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopdb_consult?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=shop
spring.datasource.password=shop123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 统一 UTF-8，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---------- 问诊服务业务常量（全部可配，默认 fail-closed） ----------
# 注意（P2 修复）：ConsultProperties 为 @ConfigurationProperties(prefix="consult")，字段 wsPort/
# sessionDisconnectGraceSeconds 等按 Spring Boot 松散绑定用【平铺 kebab】键（点号是嵌套分隔符，点分键绑定不上，
# 曾致配置静默失效仅靠默认值对齐）。此处统一为与字段一致的平铺 kebab 键，配置真实生效。
# Netty WebSocket 独立端口（REST:8085 由 Tomcat 占，Tomcat 无法与 Netty 共端口，评审裁定分端口合理）
consult.ws-port=8086
# 心跳探活：读空闲 30s 发 ping；连续两个周期无响应判定死连关闭
consult.ws-heartbeat-interval-seconds=30
# 断线缓冲：身份离线后 60s 内重连会话继续，超时由调度器置 ENDED(DISCONNECT_TIMEOUT)
consult.session-disconnect-grace-seconds=60
# 空闲超时：ONGOING 会话 30min 无文本消息（心跳/系统消息不计）置 EXPIRED
consult.session-idle-timeout-seconds=1800
# 调度器扫表周期（空闲/断线/处方过期统一兜底；@Scheduled 占位符也用此键）
consult.session-sweep-interval-seconds=60
# 处方默认有效期（开方 + 7 天）
consult.prescription-valid-days=7
# 批量写队列：每会话消息队列上限（超限丢弃新消息并回 OVERLOADED 错误帧）
consult.batch-queue-capacity=500
# 批量写队列：累计满阈值条数或距上次 drain 超 1s 即 drain
consult.batch-drain-threshold=20
consult.batch-drain-interval-ms=1000
