# ---------- 测试环境：H2 内存库覆盖主配置（功能/集成测试用，不连接外部 MySQL） ----------
spring.datasource.url=jdbc:h2:mem:consult;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---------- 测试用短时序参数（生产值不污染，见 ConsultProperties / SessionEndScheduler） ----------
# 关键（P2 修复）：ConsultProperties 是 @ConfigurationProperties，字段 `sessionDisconnectGraceSeconds` 等
# 的规范绑定名是【平铺 kebab】（`session-disconnect-grace-seconds`）。点号是嵌套分隔符，点分键（`session.*`、
# `batch.*`、`ws.port`）绑定不上、静默失效。故测试全部用与字段一致的平铺 kebab 键，保证短时序真正生效。
# 断线缓冲 3s << 空闲 8s：保证「断线超时」与「空闲超时」两条判据测试确定性分离
#（grace=3s << idle=8s，先到的判据唯一胜出，无竞态）。
consult.session-disconnect-grace-seconds=3
consult.session-idle-timeout-seconds=8
consult.session-sweep-interval-seconds=1

# Netty WS 端口：集成测试用 @DynamicPropertySource 动态分配高位端口，避免冲突；此处值仅作兜底。
consult.ws-port=18086
consult.ws-heartbeat-interval-seconds=30

# 批量写队列：阈值 2 条/200ms 快速落库，满足「先落库后 ack」断言
consult.batch-drain-threshold=2
consult.batch-drain-interval-ms=200
consult.batch-queue-capacity=500

consult.prescription-valid-days=7
