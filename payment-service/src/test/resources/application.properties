server.port=8083
spring.application.name=payment-service

# ---------- 内部服务地址（测试中 OrderClient 被 @MockBean 替换，仅作占位） ----------
mall.order-service.url=http://localhost:8082

# ---------- 测试数据库：H2 内存，MySQL 兼容模式 ----------
spring.datasource.url=jdbc:h2:mem:payt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
