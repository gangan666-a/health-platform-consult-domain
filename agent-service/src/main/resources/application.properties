server.port=8087
spring.application.name=agent-service

# ---------- DeepSeek（OpenAI 兼容 API）----------
# ⭐ DeepSeek API Key：优先用环境变量 DEEPSEEK_API_KEY 注入，不要把真实 Key 提交进仓库。
# 未配置或 placeholder 开头时，Agent 使用占位回复但仍可启动。本地临时调试可把下方占位符改成你的 sk- Key（改完勿 commit）。
agent.deepseek.api-key=${DEEPSEEK_API_KEY:placeholder-local-dev}
spring.ai.openai.api-key=${agent.deepseek.api-key:placeholder-local-dev}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.3
# 本地无 ES 时可取消注释，Agent 对话仍可用（RAG 降级为空）
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.elasticsearch.ElasticsearchVectorStoreAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

# ---------- ES 知识库索引（自定义 ES Java Client，非 Spring AI 向量库） ----------
# 10 个医疗知识索引：drug/symptom/disease/department/lab_exam/health_content/drug_interaction/faq_compliance/knowledge_relation/report_template
# ⚠️ ES 节点需安装 IK 分词插件：elasticsearch-plugin install analysis-ik
es.knowledge.uris=http://localhost:9200
es.knowledge.init-enabled=true
# 启动时灌入演示种子数据（幂等，按 doc_id 去重）；生产灌数后可关闭
es.knowledge.seed-enabled=true

# ---------- Hybrid 检索（BM25 + 向量 + RRF） ----------
# Embedding 走阿里 text-embedding-v3（DashScope OpenAI 兼容模式）；api-key 留空 → 向量路降级 BM25-only
agent.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
agent.embedding.api-key=
agent.embedding.model=text-embedding-v3
agent.embedding.dimensions=1024

# ---------- 数据库：外部 MySQL（本机 3306，数据库 shopdb_agent，用户 shop） ----------
# 报告记录/指标明细/健康档案（长期记忆）；会话状态仍为内存态
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopdb_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=shop
spring.datasource.password=shop123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- 下游服务（Sub Agent 工具调用） ----------
mall.medicine-service.url=http://localhost:8081
mall.consult-service.url=http://localhost:8085

# ---------- Agent 编排 ----------
agent.orchestration.max-supervisor-rounds=3
agent.orchestration.handoff-enabled=true

# ---------- 报告解读（plan-execute：LLM 规划/抽取/页面分类模型，留空沿用默认 chat 模型） ----------
agent.report.classifier.model=
agent.report.planner.model=
agent.report.extractor.model=
# 图像归一化（EXIF 方向矫正 + Java2D 降采样）：最长边上限，控制多模态 LLM 输入体积
agent.report.image.max-dimension=2048

# ---------- 视觉通道（GLM-4.6V 系列，智谱 OpenAI 兼容协议） ----------
# api-key 留空 → 视觉通道未接入（Mock 明确未识别）；填智谱 Key 即启用
agent.report.vision.base-url=https://open.bigmodel.cn/api/paas/v4
agent.report.vision.api-key=
# 免费档主力（受平台并发/RPM 限制）；付费档兜底（并发溢出/调用失败升级，¥1/¥3 每百万 token）
agent.report.vision.model=glm-4.6v-flash
agent.report.vision.fallback-model=glm-4.6v
# 免费档并发额度（按智谱免费模型限制设置）；溢出请求直接走付费档保吞吐
agent.report.vision.free-concurrency=2

# ---------- 医疗知识图谱（Neo4j）：指标异常→疾病多跳推理，图不可用降级 ES knowledge_relation 查表 ----------
# 本地未部署 Neo4j 时不阻断启动（连接探活失败自动跳过种子与图推理）
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j-password
agent.graph.enabled=true
agent.graph.seed-enabled=true
# 图探活结果缓存（毫秒）：避免一次会话内多次解读反复建连探活（P0-1）
agent.graph.probe-cache-ms=5000
# 驱动连接超时：图不可用时快速失败降级 ES 关系查表，不拖慢解读主流程
spring.neo4j.connection-timeout=2s

# ---------- 原文留档（对象存储）：生产 OSS，演示/降级本地目录 ----------
# enabled=false（默认）→ LocalReportFileStorage（agent.storage.local-dir）；失败自动降级不留档
agent.oss.enabled=false
agent.storage.local-dir=./data/report-files
# 生产配置示例（enabled=true 时生效）：SSE 服务端加密 + 预签名 URL 限时访问 + 桶生命周期管理保留期
agent.oss.endpoint=oss-cn-hangzhou.aliyuncs.com
agent.oss.access-key-id=
agent.oss.access-key-secret=
agent.oss.bucket=

# ---------- 数值防线：LLM 抽取后双次交叉校验（抄错/幻觉按原文纠正） ----------
agent.report.verify.enabled=true

# ---------- 观测：Micrometer Tracing（traceId/spanId 进日志）+ 业务指标(/actuator/metrics) ----------
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.endpoints.web.exposure.include=health,metrics

# ---------- 告警：熔断开闸等事件出口（配置 webhook 后推钉钉/飞书群机器人） ----------
agent.alert.webhook=

# ---------- 报告异步任务（进程内任务队列 + SSE 进度；生产演进：MQ + 任务表持久化） ----------
agent.report.task.max-concurrent=8
agent.report.task.ttl-minutes=30

# ---------- LLM 网关（多供应商路由 + 模型亲和 + 限流 + 熔断 + 计量） ----------
agent.llm.primary-name=deepseek
# 主供应商托管模型清单（模型亲和路由：请求模型名命中者优先路由，避免跨供应商模型名白烧失败调用）
agent.llm.primary-models[0]=deepseek-chat
agent.llm.primary-models[1]=deepseek-reasoner
# 备用供应商示例（OpenAI 兼容协议；api-key 留空则不注册，框架就绪随时可挂）：
# agent.llm.providers[0].name=zhipu
# agent.llm.providers[0].base-url=https://open.bigmodel.cn/api/paas/v4
# agent.llm.providers[0].api-key=
# agent.llm.providers[0].model=glm-4.7-flash
# agent.llm.providers[0].models[0]=glm-4.7-flash
# agent.llm.providers[0].models[1]=glm-4.6v-flash
# agent.llm.providers[0].models[2]=glm-4.6v
# 解读失败升级重试模型（同供应商更强档，deepseek-chat 失败→deepseek-reasoner 再试一次；留空关闭）
agent.llm.escalation-model=deepseek-reasoner
# 每供应商限流：10s 内最多 30 次调用，等待令牌超过 5s 判定该供应商失败并故障转移
agent.llm.rate-limiter.limit-for-period=30
agent.llm.rate-limiter.limit-refresh-period=10s
agent.llm.rate-limiter.timeout-duration=5s
# 每供应商熔断：滑动窗口 10 次中失败率 ≥50% 开闸 30s（快速故障转移，半开自动试探恢复）
agent.llm.circuit-breaker.failure-rate-threshold=50
agent.llm.circuit-breaker.wait-duration-in-open-state=30s
agent.llm.circuit-breaker.sliding-window-size=10
agent.llm.circuit-breaker.minimum-number-of-calls=5
# 计量单价（每百万 token，估算成本用；按官网现价调整）
agent.llm.prices.deepseek.input-per-million=2.0
agent.llm.prices.deepseek.output-per-million=8.0

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
