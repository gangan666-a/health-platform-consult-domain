# 测试环境覆盖主配置：内存库 H2（无需外部 MySQL）+ 占位 Key（不真调 DeepSeek）
# base-url/model 与主配置对齐（test 资源整文件遮蔽主配置，缺省会落到 api.openai.com）
spring.ai.openai.api-key=placeholder-local-dev
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat

spring.datasource.url=jdbc:h2:mem:agentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 与主配置一致：排除 Spring AI ES 向量库自动配置（测试不依赖 ES/知识索引）
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.elasticsearch.ElasticsearchVectorStoreAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
# 测试不灌种子、不查 ES
es.knowledge.seed-enabled=false
# 测试留档走 target 目录（不污染工作区）
agent.storage.local-dir=./target/test-report-files
